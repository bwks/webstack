[workspace]
members = [
    "crates/webstack",
    "crates/webstack-auth",
    "crates/webstack-backup",
    "crates/webstack-cli",
    "crates/webstack-core",
    "crates/webstack-db",
    "crates/webstack-test",
    "crates/webstack-web",
    "examples/demo",
]
default-members = ["crates/webstack-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
