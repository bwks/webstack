[workspace]
members = [
    "crates/webstack",
    "crates/webstack-auth",
    "crates/webstack-backup",
    "crates/webstack-cli",
    "crates/webstack-core",
    "crates/webstack-db",
    "crates/webstack-test",
    "crates/webstack-web",
    "examples/demo",
]
default-members = ["crates/webstack-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
async-trait = "0.1.89"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8", "tracing-0.1"] }
axum = "0.8.9"
axum-login = "0.18.0"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
garde = { version = "0.23.0", features = ["derive"] }
form_urlencoded = "1.2.2"
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
rand = "0.8.5"
rust-embed = "8.11.0"
surrealdb = { version = "=3.2.1", default-features = false, features = ["kv-rocksdb"] }
secrecy = { version = "0.10.3", features = ["serde"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "parsing"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-cookies = "0.11.0"
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
