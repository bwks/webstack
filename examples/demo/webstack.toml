environment = "development"

[assets]
tailwind_version = "4.3.1"
daisyui_version = "5.6.18"
htmx_version = "4.0.0-beta5"

[server]
bind_addr = "0.0.0.0"
https_port = 7337
http_port = 42069
http_redirect = true
shutdown_timeout_seconds = 30

[tls]
mode = "self_signed"

[auth]
session_ttl_hours = 168
bootstrap_admin = true
password_ttl_days = 90
